# 基于仓库 Maven 配置执行打包，再查看 CLI 帮助。
# Package the project with Maven, then display the CLI help.
version = 1
parallelism = 4

tools = [
  {
    name = build
    cmd = "mvn package"
  },
  {
    name = help
    cmd = "java -jar target/devpulse.jar --help"
    needs = [build]
  }
]

pipelines {
  dev {
    description = "构建项目并检查 CLI 帮助 / Build the project and check CLI help"
    tasks = [build, help]
  }
}
