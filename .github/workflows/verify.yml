name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run machine gate
        run: bash verify.sh

  native:
    name: native image (GraalVM 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # native-image links against zlib; the development symlink is what -lz needs.
      - name: Install zlib development headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      # A native image with incomplete metadata still compiles and fails only at
      # runtime, so the smoke checks in --verify are the gate for this job.
      - name: Build and verify the native executable
        run: bash native.sh --verify
